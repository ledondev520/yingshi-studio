<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101310">
  <meta name="description" content="映室创作工作台：输入创意，生成短片或高清图片。">
  <title>映室 · 影像创作工作台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23dff49c'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%231f2d11' stroke-width='2.4'/%3E%3Ccircle cx='16' cy='16' r='3.4' fill='%231f2d11'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css?v=mobile5">
  <script src="app.js?v=mobile5" defer></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <i class="brandmark" aria-hidden="true">◉</i>
      <span class="brandName">映室</span>
      <b>/</b>
      <small>FRAME ROOM</small>
    </div>
    <div class="topend" role="status" aria-live="polite">
      <span id="gpuDot" class="pulse" aria-hidden="true">●</span>
      <span id="gpu">准备就绪</span>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="heroText">
        <div class="kicker"><span></span>映室 · 导演工作台</div>
        <h1>让想象成为画面<span>。</span></h1>
        <p>一张图片，或一段短片。写下创意，其余交给导演。</p>
      </div>
    </section>

    <p id="activationMsg" class="msg bannerMsg" role="status"></p>

    <div id="desk">
      <div class="sectionbar">
        <div class="heading">
          <span class="num">01</span>
          <h2>创作台</h2>
        </div>
        <span id="draftStatus" class="micro">自动保存草稿</span>
      </div>

      <section class="grid">
        <article class="idea">
          <fieldset class="modelPick kindPick">
            <legend>创作类型</legend>
            <div class="modelOptions">
              <label><input type="radio" name="creationKind" value="video" checked><span>视频</span></label>
              <label><input type="radio" name="creationKind" value="image"><span>图片</span></label>
            </div>
          </fieldset>

          <div class="ideaHead">
            <h3><label for="prompt">这一次，想创作什么？</label></h3>
            <button id="clearPrompt" type="button" class="ghostBtn" hidden aria-label="清空已输入的提示词">清空 ×</button>
          </div>

          <div id="reply" hidden>
            <span id="replyText"></span>
            <button id="newIdea" type="button">改为独立创意 ×</button>
          </div>

          <textarea id="prompt" maxlength="4000" placeholder="比如：大雨敲着窗，家里的橘猫和雪纳瑞围着仙女棒聊天。让我们听见雨声和它们的对白。"></textarea>

          <div class="inputmeta">
            <span id="promptMeta" class="metaHint">画面 · 动作 · 声音 · 对白</span>
            <span id="count">0 / 4000</span>
          </div>

          <fieldset id="imageCanvas" class="modelPick" hidden>
            <legend>图片画幅</legend>
            <div class="modelOptions threeCols">
              <label><input type="radio" name="imageAspect" value="landscape" checked><span>横图</span></label>
              <label><input type="radio" name="imageAspect" value="portrait"><span>竖图</span></label>
              <label><input type="radio" name="imageAspect" value="square"><span>方幅</span></label>
            </div>
          </fieldset>

          <div id="videoDuration" class="lengthPick">
            <label for="duration">
              <span id="lengthLabel">成片时长</span>
              <output id="durationText" for="duration">15 秒</output>
            </label>
            <input type="range" id="duration" min="15" max="75" step="15" value="15" list="durationTicks">
            <datalist id="durationTicks">
              <option value="15"></option>
              <option value="30"></option>
              <option value="45"></option>
              <option value="60"></option>
              <option value="75"></option>
            </datalist>
            <div id="durationStops" class="rangeStops" role="group" aria-label="可选时长">
              <button type="button" data-sec="15" aria-pressed="true">15秒</button>
              <button type="button" data-sec="30" aria-pressed="false">30秒</button>
              <button type="button" data-sec="45" aria-pressed="false">45秒</button>
              <button type="button" data-sec="60" aria-pressed="false">60秒</button>
              <button type="button" data-sec="75" aria-pressed="false">75秒</button>
            </div>
          </div>

          <p class="sub" id="qualityHint">量化加速 · 默认 768p。可写明「竖屏」「快速预览」或「保留原声」。</p>
          <a id="modelWorker" class="sub workerLink" hidden download href="colab-worker.ipynb">下载量化执行端</a>

          <div class="actionrow">
            <button id="submit" disabled class="primary">提交生成 →</button>
          </div>
          <p id="workMsg" class="msg" role="status"></p>
        </article>

        <article id="boardCard" class="board" data-empty="1">
          <div class="boardTitle">
            <h3 id="boardHeading">分镜脚本</h3>
            <div class="boardMeta">
              <span id="shotLabel" class="tag">等待创意</span>
              <button id="toggleShots" type="button" class="ghostBtn" hidden>展开</button>
            </div>
          </div>
          <p class="sub" id="shotHint">提交后，分镜会在这里逐段出现。</p>
          <div id="shots"></div>
        </article>
      </section>

      <div class="sectionbar historytitle">
        <div class="heading">
          <span class="num">02</span>
          <h2 id="historyTitle">任务与作品</h2>
        </div>
        <span id="jobCount" class="micro">0 个任务</span>
      </div>

      <div class="jobbar">
        <div id="tabs" class="tabs" role="group" aria-label="筛选任务">
          <button type="button" data-filter="all" aria-pressed="true">全部</button>
          <button type="button" data-filter="active" aria-pressed="false">进行中</button>
          <button type="button" data-filter="done" aria-pressed="false">已完成</button>
        </div>
        <span class="tag" id="workerSeen">准备中</span>
      </div>

      <div id="jobs" aria-live="off"></div>
    </div>

    <dialog id="preview">
      <div class="playerHead">
        <strong id="previewHeading">作品预览</strong>
        <button id="closePreview" type="button" aria-label="关闭预览">关闭 ×</button>
      </div>
      <div id="frame"></div>
      <div class="playerFoot">
        <p id="previewStatus" role="status"></p>
        <div class="playerActions">
          <button id="retryPreview" type="button" class="secondary downloadBtn" hidden>播放／重试</button>
          <a id="downloadFilm" class="secondary downloadBtn" href="#" download>下载高清原片</a>
        </div>
      </div>
    </dialog>

    <footer>
      <span>映室</span>
      <span class="footSub">影像创作工作台</span>
    </footer>
  </main>
</body>
</html>
